name: Regression
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.7
      - run: python -m ruff check .
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -ra
      - run: python -m aeris --self-test
  audio-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -e '.[dev,voice]'
      - run: python -m pytest -ra
      - run: python -m ruff check .
        if: always()
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -ra
      - run: python -m ruff check .
        if: always()
      - run: python -m aeris --self-test
  ui-offscreen:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' PySide6==6.11.2 psutil==7.2.2
      - run: python -m pytest tests/test_companion_ui.py tests/test_companion_recovery.py tests/test_connected_workflow_ui.py tests/test_desktop_lifecycle.py tests/test_review_qt.py -ra
      - run: python -m aeris --self-test
        if: always()
